name: Funktion vorschlagen
description: Eine Nutzeraufgabe oder Produktverbesserung beschreiben
title: "feat: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Nutzerproblem
      description: Welches konkrete Problem entsteht heute und für wen?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Gewünschtes Ergebnis
      description: Was soll eine Person danach einfacher, sicherer oder schneller erledigen können?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Lösungsidee
      description: Optional – der Problemkontext ist wichtiger als eine fertige UI-Lösung.
  - type: textarea
    id: acceptance
    attributes:
      label: Akzeptanzkriterien
      placeholder: |
        - [ ] ...
        - [ ] ...
  - type: checkboxes
    id: risk
    attributes:
      label: Mögliche Risikobereiche
      options:
        - label: Medizinische Aussage oder Schwellenwert
        - label: Gesundheits- oder Profildaten
        - label: Anmeldung oder Synchronisierung
        - label: Benachrichtigung, Uhrzeit oder Zeitzone
  - type: checkboxes
    id: privacy
    attributes:
      label: Datenschutz
      options:
        - label: Der Vorschlag enthält ausschließlich fiktive Beispieldaten.
          required: true
